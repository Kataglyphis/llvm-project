name: Linux x64 · code quality measurements

on:
  # The scanners cover Python, shell, Dockerfiles and Markdown; C++ edits need no new scan.
  push:
    paths:
      - '**/*.py'
      - '**/*.sh'
      - '**/*.md'
      - '**/Dockerfile*'
      - '.github/workflows/**'
      - '.gitmodules'
      - 'third_party/ANTfrastructure'
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.sh'
      - '**/*.md'
      - '**/Dockerfile*'
      - '.github/workflows/**'
      - '.gitmodules'
      - 'third_party/ANTfrastructure'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/code-quality-report.yml@develop
